<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #2c3e50 !important; }
        .sidebar { min-height: calc(100vh - 56px); background-color: #34495e; }
        .sidebar a { color: #bdc3c7; text-decoration: none; display: block; padding: 10px 15px; }
        .sidebar a:hover { background-color: #2c3e50; color: white; }
        .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark px-3">
        <span class="navbar-brand fw-bold"><i class="bi bi-wallet2 me-2"></i>Expense Tracker</span>
        {% if user.is_authenticated %}
        <div class="d-flex align-items-center gap-3">
            <span class="text-white small">{{ user.username }}</span>
            <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-light">Logout</a>
        </div>
        {% endif %}
    </nav>

    <div class="container-fluid">
        <div class="row">
            {% if user.is_authenticated %}
            <div class="col-md-2 sidebar p-0">
                <a href="{% url 'dashboard' %}"><i class="bi bi-house me-2"></i>Dashboard</a>
                <a href="{% url 'transaction_list' %}"><i class="bi bi-list-ul me-2"></i>Transactions</a>
                <a href="{% url 'transaction_add' %}"><i class="bi bi-plus-circle me-2"></i>Add Transaction</a>
                <a href="{% url 'category_list' %}"><i class="bi bi-tags me-2"></i>Categories</a>
            </div>
            {% endif %}

            <div class="{% if user.is_authenticated %}col-md-10{% else %}col-12{% endif %} p-4">
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}

                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
